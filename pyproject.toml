[project]
name = "relguide"
version = "0.1.0"
description = "Unified relative guidance and control framework covering missile homing intercept and spacecraft orbital rendezvous."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy>=1.10", "matplotlib"]

[tool.setuptools.packages.find]
include = ["relguide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D107"]  # D107: Args are documented in the class docstring

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pyright]
reportMissingTypeStubs = false


